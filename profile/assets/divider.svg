<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">A thin brand-gradient divider with a slanted notch.</desc><defs>
