</defs><style>.glint{animation:glint 7s ease-in-out infinite}@keyframes glint{0%{transform:translateX(0)}60%,100%{transform:translateX(1020px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3de3ff" stop-opacity="0"/><stop offset=".2" stop-color="#3de3ff"/><stop offset=".5" stop-color="#9b5cff"/><stop offset=".8" stop-color="#f47cf4"/><stop offset="1" stop-color="#f47cf4" stop-opacity="0"/></linearGradient><linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><polygon points="0.0,3.0 900.0,3.0 900.0,5.0 0.0,5.0" fill="url(#fade)"/><polygon points="434.0,0.0 472.0,0.0 466.0,8.0 428.0,8.0" fill="#8b4dff"/><rect class="glint" x="-120" y="2.5" width="120" height="3" fill="url(#glint)"/></svg>
